spring.application.name=${ERP_APP_NAME:erp}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:erp}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
erp.minio.endpoint=${MINIO_ENDPOINT:}
erp.minio.bucket=${MINIO_BUCKET:}
erp.minio.access-key=${MINIO_ACCESS_KEY:}
erp.minio.secret-key=${MINIO_SECRET_KEY:}

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

erp.auth.token-hours=${ERP_AUTH_TOKEN_HOURS:24}
erp.auth.seed-username=${ERP_SEED_ADMIN_USERNAME:}
erp.auth.seed-password=${ERP_SEED_ADMIN_PASSWORD:}
erp.auth.seed-real-name=${ERP_SEED_ADMIN_REAL_NAME:}
erp.auth.seed-employee-no=${ERP_SEED_ADMIN_EMPLOYEE_NO:}
erp.logging.request-id-header=${ERP_REQUEST_ID_HEADER:X-Request-Id}

