services:
  mysql:
    image: mysql:8.4
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erp}
      MYSQL_USER: ${MYSQL_USER:-erp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env or the shell environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env or the shell environment}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - erp_mysql_data:/var/lib/mysql
volumes:
  erp_mysql_data:
